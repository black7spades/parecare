version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-parecare}
      POSTGRES_USER: ${DB_USER:-parecare}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-parecare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Pare's assistant, running on this machine. Its model lives on its own named
  # volume so it survives a redeploy and is only downloaded once. A graphics
  # card is used automatically when the host exposes one (install the NVIDIA
  # container toolkit and add a device reservation); otherwise it runs on the
  # processor, slower but private. Nothing here leaves the machine.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  # A one-shot that runs at first start, picks the local model that suits this
  # machine, downloads it, and gives it the stable name "parecare" so the api
  # can talk to one name whichever was chosen. It then exits. When a cloud
  # assistant is configured instead, it downloads nothing and exits at once.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      # The two model tags live here and nowhere else, so correcting one is a
      # one-line change. A graphics card gets the larger model; anything else
      # gets the smaller one, which still reads text and images.
      AI_MODEL_GPU: ${AI_MODEL_GPU:-gemma4:12b-it-q4_K_M}
      AI_MODEL_CPU: ${AI_MODEL_CPU:-gemma4:e4b-it-q4_K_M}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$$AI_PROVIDER" != "ollama" ]; then
          echo "A cloud assistant is configured, so no local model is needed."
          exit 0
        fi
        echo "Waiting for the on-machine assistant to start..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        if nvidia-smi -L >/dev/null 2>&1; then
          MODEL="$$AI_MODEL_GPU"
          echo "A graphics card was found. Setting up the larger assistant: $$MODEL"
        else
          MODEL="$$AI_MODEL_CPU"
          echo "No graphics card found. Setting up the smaller assistant: $$MODEL"
        fi
        ollama pull "$$MODEL"
        ollama cp "$$MODEL" parecare
        echo "Pare is ready on this machine."

  api:
    build: ./packages/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-parecare}:${DB_PASSWORD}@db:5432/${DB_NAME:-parecare}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # By default Pare runs on this machine through the bundled ollama service,
      # so nothing leaves here and no key is needed. Set AI_PROVIDER=anthropic
      # with a key to use Claude instead (faster, but records are sent away).
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      # "parecare" is the stable name the puller gives whichever local model it
      # chose for this machine, so the app talks to one name either way.
      AI_MODEL: ${AI_MODEL:-parecare}
      AI_MEDIATION_MODEL: ${AI_MEDIATION_MODEL:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: /app/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_FAMILY: ${STRIPE_PRICE_FAMILY:-}
      STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@parecare.app}
      SELF_HOSTED: ${SELF_HOSTED:-true}
      AI_TOKENS_FREE: ${AI_TOKENS_FREE:-0}
      AI_TOKENS_FAMILY: ${AI_TOKENS_FAMILY:-100000}
      AI_TOKENS_PROFESSIONAL: ${AI_TOKENS_PROFESSIONAL:--1}
      BACKUPS_ENABLED: ${BACKUPS_ENABLED:-on}
      BACKUPS_FREQUENCY: ${BACKUPS_FREQUENCY:-daily}
      BACKUPS_KEEP_DAYS: ${BACKUPS_KEEP_DAYS:-30}
      BACKUPS_PATH: /app/backups
    volumes:
      - uploads_data:/app/uploads
      # Kept apart from uploads so a copy never ends up containing itself,
      # and on its own volume so copies outlive the container.
      - backups_data:/app/backups
    # Lets the container reach Ollama / LM Studio running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./packages/web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:3001}
      VITE_SELF_HOSTED: ${SELF_HOSTED:-true}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backups_data:
  ollama_data:
