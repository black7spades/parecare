# No upstream blocks on purpose. nginx resolves an upstream's hostname once,
# at startup, and caches that address for the life of the process. A redeploy
# recreates the api and web containers with new addresses, so an nginx that
# was not recreated in the same pass keeps proxying to containers that no
# longer exist: every request 502s, the web app reports that the server could
# not be reached, and the whole instance looks dead while it is perfectly
# healthy. Naming the targets through variables instead defers the lookup to
# request time, where the resolver below answers it.

server {
  listen 80;

  # Docker's embedded DNS server. valid=10s re-checks often enough that a
  # container recreated by a redeploy is picked up within seconds. ipv6=off
  # because Docker returns AAAA records that the containers do not listen on.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3001;
  set $web_upstream http://web:80;

  # Allow document uploads up to the API's 50 MB limit. Without this, nginx's
  # 1 MB default rejects anything larger and the browser reports "Failed to
  # fetch" because the connection is dropped before the API ever sees it.
  client_max_body_size 50m;
  # Give large uploads time to reach the API before nginx times out.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # Pare's replies can run on a model on this machine, where a single answer
  # takes minutes, and reading a whole document is slower still. Give the
  # assistant and document-reading paths far longer, without loosening the
  # timeout for everything else. A regex location is chosen ahead of the
  # /api/ prefix below, so these paths land here.
  location ~ ^/api/v1/(ai/|care-profiles/[^/]+/(ai|ingest)) {
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Stripe webhooks — pass raw body through without buffering
  location /webhooks/ {
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
  }

  location /api/ {
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass $web_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
  }
}
